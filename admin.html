<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BT2 Computer Admin</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <h1>Admin Panel</h1>
      <p>Enter the ADMIN_PASSWORD configured in Vercel.</p>
      <input id="passwordInput" type="password" placeholder="Admin password" required>
      <button type="submit">Sign in</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>

  <div id="adminApp" class="admin-app hidden">
    <aside class="sidebar">
      <h2>BT2 Admin</h2>
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="products">Products</button>
      <button class="nav-btn" data-view="orders">Orders</button>
      <button id="logoutBtn" class="logout">Sign out</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">Dashboard</h1>
        <button id="seedBtn" class="secondary">Seed sample products</button>
      </header>
      <section id="dashboardView" class="view"></section>
      <section id="productsView" class="view hidden">
        <div class="toolbar">
          <input id="productSearch" placeholder="Search products">
          <button id="newProductBtn" class="primary">Add product</button>
        </div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Category</th><th>Title</th><th>Price</th><th>Active</th><th>Actions</th></tr></thead><tbody id="productsTable"></tbody></table></div>
      </section>
      <section id="ordersView" class="view hidden">
        <div class="toolbar">
          <select id="orderStatusFilter"><option value="">All statuses</option><option>pending</option><option>processing</option><option>completed</option><option>cancelled</option></select>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="ordersTable"></tbody></table></div>
      </section>
    </main>
  </div>

  <dialog id="productDialog">
    <form id="productForm" method="dialog">
      <h2 id="productDialogTitle">Product</h2>
      <div class="form-grid">
        <label>ID<input name="id" required></label>
        <label>Category<select name="category"><option>audio</option><option>computers</option><option>accessories</option><option>smart</option></select></label>
        <label>Price<input name="price" type="number" min="0" step="0.01" required></label>
        <label>Rating<input name="rating" type="number" min="0" max="5" step="0.1"></label>
        <label>Icon<input name="icon" value="headphones"></label>
        <label>Background<input name="bg"></label>
        <label class="check"><input name="active" type="checkbox" checked> Active</label>
        <label class="wide">Translations JSON<textarea name="i18n" rows="12" required>{}</textarea></label>
      </div>
      <div class="dialog-actions"><button type="button" id="cancelProductBtn">Cancel</button><button type="submit" class="primary">Save</button></div>
    </form>
  </dialog>
  <script src="/admin.js" defer></script>
</body>
</html>
